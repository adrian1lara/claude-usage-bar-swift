name: Release

# Builds the app and publishes a GitHub Release on every push to the main branch.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

# Allow the workflow to create releases/tags.
permissions:
  contents: write

# One release build at a time; cancel superseded pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    # Liquid Glass (.glassEffect / GlassEffectContainer) needs the macOS 26 SDK.
    # If the macos-26 image isn't available on your runners, switch to macos-latest.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClaudeUsageBar/ClaudeUsageBar.xcodeproj \
            -scheme ClaudeUsageBar \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package .app into a DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/ClaudeUsageBar.app"
          test -d "$APP"
          STAGING="dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"   # drag-to-install target
          hdiutil create \
            -volname "ClaudeUsageBar" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "ClaudeUsageBar.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClaudeUsageBar v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: ClaudeUsageBar.dmg
